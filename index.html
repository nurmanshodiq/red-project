<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1730">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>RED Project — Manajemen Live Streaming</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0b1730;--navy2:#122447;--blue:#2878ff;--cyan:#23c4e8;--ink:#17243b;--muted:#738098;--line:#e6ebf2;--bg:#f4f7fb;--white:#fff;--green:#139b68;--red:#d9475c;--amber:#c78012;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--navy);color:white;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:12px;padding:0 8px}.brandmark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#1689ff,#21c4dc);display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 8px 22px #0d78ff40}.brand strong{font-size:18px;letter-spacing:.3px}.brand small{display:block;color:#aab9d5;font-size:11px;margin-top:2px}.navlabel{color:#7184a7;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:0 12px 4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b8c5dd;text-align:left;padding:12px;border-radius:11px;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:#1c3155;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.sidebarfoot{margin-top:auto;border-top:1px solid #253756;padding:16px 8px;color:#9aabc9;font-size:12px}
main{min-width:0}.topbar{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px}.topbar h1{font-size:20px;margin:0}.subhead{font-size:12px;color:var(--muted);margin-top:3px}.userpill{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#e5efff;color:#1b67d8;font-weight:800}.content{padding:28px;max-width:1500px;margin:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.rowstart{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;color:var(--ink);font-weight:650}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 5px 14px #2878ff24}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:22px 0}.card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 4px 18px #1d355708;min-width:0}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650}.staticon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#eaf2ff;color:#2777f5;font-size:18px}.statvalue{font-size:26px;font-weight:800;letter-spacing:-.8px;margin:13px 0 4px}.statnote{font-size:11px;color:var(--muted)}.columns{grid-template-columns:1.25fr .75fr}.sectiontitle{font-size:15px;font-weight:800;margin:0}.sectiondesc{font-size:12px;color:var(--muted);margin:4px 0 0}.tablewrap{overflow:auto;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:620px}th{text-align:left;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#8390a5;padding:12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #eef1f6;font-size:12px}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:750;background:#eef2f8;color:#5b6980;white-space:nowrap}.badge.green{background:#e5f8ef;color:#128254}.badge.blue{background:#e9f1ff;color:#2169d7}.badge.amber{background:#fff3dc;color:#a76a0a}.badge.red{background:#ffebee;color:#c13a4b}.barlist{display:grid;gap:15px;margin-top:22px}.barrow{display:grid;grid-template-columns:100px 1fr 90px;align-items:center;gap:10px;font-size:12px}.bartrack{height:8px;border-radius:99px;background:#edf1f7;overflow:hidden}.barfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#2878ff,#25c4df)}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #d7dfeb;border-radius:12px;margin-top:14px}.pagehead{margin-bottom:20px}.pagehead h2{margin:0;font-size:22px}.pagehead p{margin:5px 0 0;color:var(--muted)}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:750;color:#53627a}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #dfe5ef;background:#fff;border-radius:10px;padding:11px 12px;outline:none;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#70a4ff;box-shadow:0 0 0 3px #2878ff14}.field textarea{min-height:85px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#07132bc2;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:white;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:24px;box-shadow:0 20px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:18px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:20px;right:20px;background:#102243;color:#fff;padding:13px 17px;border-radius:12px;box-shadow:0 10px 30px #0002;z-index:30;max-width:min(420px,calc(100vw - 40px))}.authscreen{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:white}.authhero{background:radial-gradient(circle at 20% 10%,#254f91,transparent 40%),linear-gradient(145deg,#09152d,#102e5b);color:white;padding:clamp(30px,7vw,90px);display:flex;flex-direction:column;justify-content:center}.authhero h1{font-size:clamp(32px,4vw,54px);line-height:1.05;letter-spacing:-1.5px;max-width:560px;margin:28px 0 16px}.authhero p{color:#b9c9e4;max-width:470px;font-size:15px}.authfeature{display:flex;gap:10px;align-items:center;color:#dce8fc;margin-top:13px}.authbox{padding:clamp(25px,6vw,75px);display:flex;justify-content:center;flex-direction:column;max-width:600px;width:100%;margin:auto}.authbox h2{font-size:26px;margin:0 0 6px}.authbox>p{color:var(--muted);margin:0 0 25px}.authbox .field{margin-bottom:14px}.mobilemenu{display:none}.notice{padding:12px 14px;background:#fff7e7;color:#865a10;border:1px solid #f6dfaa;border-radius:10px;font-size:12px;margin:15px 0}
@media(max-width:1050px){.app{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.content{padding:22px}.topbar{padding:0 22px}}
@media(max-width:700px){.app{display:block}.sidebar{display:none}.topbar{height:68px;padding:0 16px}.topbar h1{font-size:17px}.mobilemenu{display:inline-flex}.content{padding:16px}.stats{gap:10px;margin:15px 0}.card{padding:15px}.statvalue{font-size:21px}.stathead{font-size:11px}.staticon{width:30px;height:30px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.authscreen{grid-template-columns:1fr}.authhero{display:none}.authbox{padding:28px 22px}.hide-mobile{display:none}.barrow{grid-template-columns:78px 1fr 75px}.userpill span{display:none}}
</style></head>
<body>
<div id="root"><div style="padding:30px;color:#52627b">Memuat RED Project…</div></div>
<div id="modalroot"></div><div id="toastroot"></div>
<script>
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
const dateFmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={client:null,user:null,page:'dashboard',events:[],clients:[],equipment:[],transactions:[],loading:false};
let supa=null, config={url:localStorage.getItem('red_supabase_url')||'',key:localStorage.getItem('red_supabase_key')||''};
function toast(msg){$('#toastroot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastroot').innerHTML='',3500)}
function cfgReady(){return !!(config.url&&config.key&&window.supabase)}
function showAuth(){ $('#root').innerHTML=`<div class="authscreen"><section class="authhero"><div class="brand"><div class="brandmark">R</div><div><strong>RED Project</strong><small>LIVE STREAMING MANAGEMENT</small></div></div><h1>Semua proyek. Satu kendali.</h1><p>Kelola jadwal acara, klien, peralatan, dan keuangan usaha live streaming Anda dalam satu dashboard profesional.</p><div class="authfeature">✓ &nbsp; Kalender dan status proyek</div><div class="authfeature">✓ &nbsp; Pencatatan pemasukan dan biaya</div><div class="authfeature">✓ &nbsp; Database cloud dengan akun pribadi</div></section><section class="authbox"><h2>${cfgReady()?'Masuk ke RED Project':'Hubungkan database cloud'}</h2><p>${cfgReady()?'Gunakan akun Anda untuk mengakses data usaha.':'Masukkan konfigurasi Supabase sekali untuk mengaktifkan database permanen.'}</p>${!cfgReady()?`<div class="notice">Buat proyek Supabase gratis, jalankan schema.sql, lalu masukkan URL proyek dan anon/publishable key. Jangan pernah masukkan service_role key di sini.</div><div class="field"><label>Supabase Project URL</label><input id="cfgurl" placeholder="https://xxxx.supabase.co" value="${esc(config.url)}"></div><div class="field"><label>Supabase anon / publishable key</label><input id="cfgkey" placeholder="eyJ..." value="${esc(config.key)}"></div><button class="btn primary" style="width:100%;margin-top:5px" onclick="saveConfig()">Simpan konfigurasi</button>`:`<div class="field"><label>Email</label><input id="email" type="email" placeholder="nama@email.com" autocomplete="email"></div><div class="field"><label>Kata sandi</label><input id="password" type="password" placeholder="Minimal 6 karakter" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin:6px 0 10px" onclick="authAction('login')">Masuk</button><button class="btn" style="width:100%" onclick="authAction('signup')">Buat akun baru</button><button class="btn small" style="margin-top:14px" onclick="editConfig()">Ubah konfigurasi database</button>`}</section></div>`}
function saveConfig(){let u=$('#cfgurl').value.trim(),k=$('#cfgkey').value.trim();if(!u.startsWith('https://')||!k){toast('Periksa URL dan key Supabase.');return}config={url:u,key:k};localStorage.setItem('red_supabase_url',u);localStorage.setItem('red_supabase_key',k);initClient();showAuth();toast('Konfigurasi disimpan di browser ini.')}
function editConfig(){config={url:'',key:''};showAuth()}
function initClient(){if(cfgReady())supa=window.supabase.createClient(config.url,config.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}
async function authAction(action){let email=$('#email').value.trim(),password=$('#password').value;if(!email||!password){toast('Isi email dan kata sandi.');return}try{let r=action==='login'?await supa.auth.signInWithPassword({email,password}):await supa.auth.signUp({email,password});if(r.error)throw r.error;if(action==='signup'&&!r.data.session){toast('Akun dibuat. Cek email untuk verifikasi, lalu masuk.');return}state.user=r.data.user;await boot()}catch(e){toast(e.message||'Autentikasi gagal.')}}
async function boot(){const {data:{session}}=await supa.auth.getSession();state.user=session?.user||null;if(!state.user){showAuth();return}renderShell();await loadData()}
async function loadData(){state.loading=true;renderPage();try{let names=['events','clients','equipment','transactions'];let res=await Promise.all(names.map(n=>supa.from(n).select('*').order('created_at',{ascending:false})));for(let i=0;i<names.length;i++){if(res[i].error)throw res[i].error;state[names[i]]=res[i].data||[]}state.loading=false;renderPage()}catch(e){state.loading=false;toast('Gagal memuat data: '+e.message)}}
function renderShell(){ $('#root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">R</div><div><strong>RED Project</strong><small>LIVE STREAMING MANAGEMENT</small></div></div><div><div class="navlabel">WORKSPACE</div><nav class="nav">${navItems()}</nav></div><div class="sidebarfoot">Cloud workspace pribadi<br><span style="color:#d2def1">${esc(state.user?.email||'Pemilik usaha')}</span><br><button class="btn small" style="margin-top:12px;background:#172b4d;color:#fff;border-color:#294166" onclick="logout()">Keluar akun</button></div></aside><main><header class="topbar"><div class="rowstart"><button class="btn mobilemenu" onclick="toggleMobileNav()">☰</button><div><h1 id="topTitle">Ringkasan usaha</h1><div class="subhead">Kelola usaha live streaming dengan lebih teratur</div></div></div><div class="userpill"><div class="avatar">R</div><span style="font-size:12px;font-weight:700">${esc(state.user?.email||'Pemilik')}</span></div></header><div class="content" id="pagecontent"></div></main></div>`;renderPage()}
function navItems(){return [{id:'dashboard',icon:'▦',label:'Dashboard'},{id:'events',icon:'▣',label:'Jadwal & Proyek'},{id:'clients',icon:'♙',label:'Data Klien'},{id:'equipment',icon:'◈',label:'Tim & Peralatan'},{id:'transactions',icon:'↔',label:'Keuangan'},{id:'reports',icon:'▥',label:'Laporan'},{id:'settings',icon:'⚙',label:'Pengaturan'}].map(x=>`<button data-page="${x.id}" class="${state.page===x.id?'active':''}" onclick="navigate('${x.id}')"><span class="ico">${x.icon}</span>${x.label}</button>`).join('')}
function toggleMobileNav(){let old=$('.sidebar');if(old){old.style.display=old.style.display==='flex'?'none':'flex';old.style.position='absolute';old.style.zIndex=5;old.style.width='250px';old.style.minHeight='calc(100vh - 68px)';old.style.top='68px'}}
function navigate(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));renderPage();if(innerWidth<700){let s=$('.sidebar');if(s)s.style.display='none'}}
const titles={dashboard:'Ringkasan usaha',events:'Jadwal & Proyek',clients:'Data Klien',equipment:'Tim & Peralatan',transactions:'Keuangan',reports:'Laporan',settings:'Pengaturan'};
function badge(s){let c=({'Selesai':'green','DP Dibayar':'blue','Lunas':'green','Terjadwal':'blue','Berlangsung':'amber','Dibatalkan':'red','Tersedia':'green','Dipakai':'amber','Perawatan':'red'}[s]||'');return `<span class="badge ${c}">${esc(s||'—')}</span>`}
function renderPage(){if(!state.user)return;let el=$('#pagecontent');if(!el)return;$('#topTitle').textContent=titles[state.page]||'RED Project';if(state.loading){el.innerHTML='<div class="empty">Memuat data cloud…</div>';return}
if(state.page==='dashboard')el.innerHTML=dashboardHTML();else if(state.page==='events')el.innerHTML=eventsHTML();else if(state.page==='clients')el.innerHTML=clientsHTML();else if(state.page==='equipment')el.innerHTML=equipmentHTML();else if(state.page==='transactions')el.innerHTML=transactionsHTML();else if(state.page==='reports')el.innerHTML=reportsHTML();else el.innerHTML=settingsHTML()}
const sum=(arr,fn)=>arr.reduce((a,x)=>a+Number(fn(x)||0),0);
function dashboardHTML(){let now=new Date().toISOString().slice(0,10),up=state.events.filter(e=>e.event_date>=now&&e.status!=='Dibatalkan').sort((a,b)=>a.event_date.localeCompare(b.event_date)).slice(0,5),inc=sum(state.transactions.filter(t=>t.kind==='Masuk'),t=>t.amount),out=sum(state.transactions.filter(t=>t.kind==='Keluar'),t=>t.amount);return `<div class="row"><div><div class="pagehead"><h2>Selamat datang kembali 👋</h2><p>Ini ringkasan aktivitas usaha Anda saat ini.</p></div></div><button class="btn primary" onclick="openForm('events')">＋ Tambah proyek</button></div><div class="grid stats">${stat('Total proyek',state.events.length,'▣','Semua proyek')}${stat('Klien tersimpan',state.clients.length,'♙','Database klien')}${stat('Pemasukan tercatat',money(inc),'↙','Semua transaksi')}${stat('Saldo kas tercatat',money(inc-out),'◈','Pemasukan − pengeluaran')}</div><div class="grid columns"><section class="card"><div class="row"><div><h3 class="sectiontitle">Jadwal berikutnya</h3><p class="sectiondesc">Acara yang belum dibatalkan</p></div><button class="btn small" onclick="navigate('events')">Lihat semua →</button></div>${up.length?`<div class="tablewrap"><table><thead><tr><th>Acara</th><th>Tanggal</th><th>Status</th><th>Nilai</th></tr></thead><tbody>${up.map(e=>`<tr><td><b>${esc(e.name)}</b><div class="muted">${esc(e.location||'Lokasi belum diisi')}</div></td><td>${dateFmt(e.event_date)}</td><td>${badge(e.status)}</td><td>${money(e.contract_value)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada jadwal mendatang. Tambahkan proyek pertama Anda.</div>'}</section><section class="card"><h3 class="sectiontitle">Ringkasan keuangan</h3><p class="sectiondesc">Berdasarkan transaksi yang dicatat</p><div class="barlist"><div class="barrow"><span>Pemasukan</span><div class="bartrack"><div class="barfill" style="width:${inc+out?inc/(inc+out)*100:0}%"></div></div><b>${money(inc)}</b></div><div class="barrow"><span>Pengeluaran</span><div class="bartrack"><div class="barfill" style="width:${inc+out?out/(inc+out)*100:0}%;background:linear-gradient(90deg,#ff9b61,#e24c6a)"></div></div><b>${money(out)}</b></div></div><button class="btn" style="width:100%;margin-top:24px" onclick="navigate('transactions')">Buka buku kas</button></section></div>`}
function stat(label,value,icon,note){return `<div class="card"><div class="stathead"><span>${label}</span><span class="staticon">${icon}</span></div><div class="statvalue">${value}</div><div class="statnote">${note}</div></div>`}
function pageHeader(title,desc,button,action){return `<div class="row"><div class="pagehead"><h2>${title}</h2><p>${desc}</p></div><button class="btn primary" onclick="${action}">＋ ${button}</button></div>`}
function eventsHTML(){return `${pageHeader('Jadwal & Proyek','Kelola pesanan, tanggal acara, status, dan nilai kontrak.','Tambah proyek',"openForm('events')")}<div class="card"><input class="search" placeholder="Cari nama acara, klien, atau lokasi…" oninput="filterTable('eventTable',this.value)"><div class="tablewrap"><table id="eventTable"><thead><tr><th>Nama acara</th><th>Tanggal & waktu</th><th>Klien</th><th>Lokasi</th><th>Status</th><th>Kontrak</th><th>Aksi</th></tr></thead><tbody>${state.events.map(e=>`<tr data-search="${esc([e.name,e.client_name,e.location].join(' ').toLowerCase())}"><td><b>${esc(e.name)}</b></td><td>${dateFmt(e.event_date)}<div class="muted">${esc((e.start_time||'').slice(0,5))}</div></td><td>${esc(e.client_name||'—')}</td><td>${esc(e.location||'—')}</td><td><select onchange="quickUpdate('events','${e.id}','status',this.value)">${['Terjadwal','DP Dibayar','Berlangsung','Selesai','Dibatalkan','Lunas'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${money(e.contract_value)}</td><td><button class="btn small" onclick="openForm('events','${e.id}')">Edit</button> <button class="btn small danger" onclick="delRow('events','${e.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>${state.events.length?'':'<div class="empty">Belum ada proyek tersimpan.</div>'}</div>`}
function clientsHTML(){return `${pageHeader('Data Klien','Simpan kontak pelanggan dan riwayat kerja.','Tambah klien',"openForm('clients')")}<div class="card"><input class="search" placeholder="Cari nama, organisasi, email…" oninput="filterTable('clientTable',this.value)"><div class="tablewrap"><table id="clientTable"><thead><tr><th>Nama klien</th><th>Organisasi</th><th>Telepon</th><th>Email</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody>${state.clients.map(c=>`<tr data-search="${esc([c.name,c.organization,c.phone,c.email].join(' ').toLowerCase())}"><td><b>${esc(c.name)}</b></td><td>${esc(c.organization||'—')}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.notes||'—')}</td><td><button class="btn small" onclick="openForm('clients','${c.id}')">Edit</button> <button class="btn small danger" onclick="delRow('clients','${c.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>${state.clients.length?'':'<div class="empty">Belum ada klien. Simpan kontak pelanggan pertama Anda.</div>'}</div>`}
function equipmentHTML(){return `${pageHeader('Tim & Peralatan','Catat kamera, laptop, audio, koneksi, serta perlengkapan produksi.','Tambah item',"openForm('equipment')")}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${state.equipment.map(e=>`<div class="card"><div class="row"><span class="staticon">◈</span>${badge(e.status)}</div><h3>${esc(e.name)}</h3><p class="muted">${esc(e.category||'Peralatan')} · Qty ${e.quantity||1}</p><p class="muted">${esc(e.notes||'Tidak ada catatan')}</p><div class="row"><button class="btn small" onclick="openForm('equipment','${e.id}')">Edit</button><button class="btn small danger" onclick="delRow('equipment','${e.id}')">Hapus</button></div></div>`).join('')}</div>${state.equipment.length?'':'<div class="empty">Belum ada inventaris. Tambahkan peralatan dan statusnya.</div>'}`}
function transactionsHTML(){let inc=sum(state.transactions.filter(t=>t.kind==='Masuk'),t=>t.amount),out=sum(state.transactions.filter(t=>t.kind==='Keluar'),t=>t.amount);return `${pageHeader('Keuangan','Catat uang masuk dan keluar untuk melihat arus kas.','Catat transaksi',"openForm('transactions')")}<div class="grid stats">${stat('Pemasukan',money(inc),'↙','Transaksi masuk')}${stat('Pengeluaran',money(out),'↗','Transaksi keluar')}${stat('Saldo tercatat',money(inc-out),'◈','Selisih arus kas')}${stat('Jumlah transaksi',state.transactions.length,'▤','Semua catatan')}</div><div class="card"><input class="search" placeholder="Cari keterangan transaksi…" oninput="filterTable('txTable',this.value)"><div class="tablewrap"><table id="txTable"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Kategori</th><th>Proyek</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody>${state.transactions.map(t=>`<tr data-search="${esc([t.description,t.category,t.kind].join(' ').toLowerCase())}"><td>${dateFmt(t.transaction_date)}</td><td>${badge(t.kind)}</td><td><b>${esc(t.description)}</b></td><td>${esc(t.category||'—')}</td><td>${esc(t.project_name||'—')}</td><td style="font-weight:800;color:${t.kind==='Masuk'?'#139b68':'#d9475c'}">${t.kind==='Masuk'?'+':'−'}${money(t.amount)}</td><td><button class="btn small" onclick="openForm('transactions','${t.id}')">Edit</button> <button class="btn small danger" onclick="delRow('transactions','${t.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>${state.transactions.length?'':'<div class="empty">Belum ada transaksi keuangan.</div>'}</div>`}
function reportsHTML(){let inc=sum(state.transactions.filter(t=>t.kind==='Masuk'),t=>t.amount),out=sum(state.transactions.filter(t=>t.kind==='Keluar'),t=>t.amount),active=state.events.filter(e=>!['Selesai','Dibatalkan'].includes(e.status)).length,contracts=sum(state.events.filter(e=>e.status!=='Dibatalkan'),e=>e.contract_value);return `${pageHeader('Laporan usaha','Ringkasan data proyek dan arus kas dari database.','Cetak laporan','window.print()')}<div class="grid stats">${stat('Nilai kontrak aktif',money(contracts),'▣','Kontrak selain dibatalkan')}${stat('Proyek aktif',active,'◷','Belum selesai/dibatalkan')}${stat('Total pemasukan',money(inc),'↙','Transaksi tercatat')}${stat('Saldo kas',money(inc-out),'◈','Masuk dikurangi keluar')}</div><div class="grid columns"><div class="card"><h3 class="sectiontitle">Ikhtisar proyek</h3><div class="barlist">${['Terjadwal','DP Dibayar','Berlangsung','Selesai','Dibatalkan','Lunas'].map(s=>{let n=state.events.filter(e=>e.status===s).length;return `<div class="barrow"><span>${s}</span><div class="bartrack"><div class="barfill" style="width:${state.events.length?n/state.events.length*100:0}%"></div></div><b>${n} proyek</b></div>`}).join('')}</div></div><div class="card"><h3 class="sectiontitle">Catatan penting</h3><p class="sectiondesc">Angka ini dihitung dari transaksi yang dimasukkan, bukan otomatis dari nilai kontrak.</p><div class="notice">Saldo kas bukan selalu laba bersih. Masukkan seluruh biaya proyek—sewa alat, transportasi, internet, konsumsi, dan honor kru—agar laporan lebih akurat.</div><button class="btn" onclick="exportCSV()">Ekspor transaksi ke CSV</button></div></div>`}
function settingsHTML(){return `${pageHeader('Pengaturan','Kelola koneksi dan akun database cloud.','','')}<div class="card"><h3 class="sectiontitle">Koneksi Supabase</h3><p class="sectiondesc">Database cloud yang digunakan oleh aplikasi ini.</p><div style="margin:18px 0"><div class="muted">Project URL</div><b>${esc(config.url)}</b></div><div style="margin:18px 0"><div class="muted">Akun aktif</div><b>${esc(state.user?.email||'—')}</b></div><div class="notice">URL dan anon/publishable key berada di browser. Keamanan data bergantung pada Row Level Security (RLS) pada database. Jangan menggunakan service_role key di frontend.</div><button class="btn" onclick="loadData()">↻ Sinkronkan data</button> <button class="btn" onclick="editConfig()">Ubah konfigurasi</button> <button class="btn danger" onclick="logout()">Keluar akun</button></div>`}
function filterTable(id,q){let table=$('#'+id);if(!table)return;table.querySelectorAll('tbody tr').forEach(r=>r.style.display=(r.dataset.search||'').includes(q.toLowerCase())?'':'none')}
function optionsForClients(selected){return `<option value="">— Pilih klien (opsional) —</option>`+state.clients.map(c=>`<option value="${esc(c.name)}" ${selected===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}
function openForm(type,id){let data=(state[type]||[]).find(x=>x.id===id)||{};let fields={events:[['name','Nama acara','text',true],['client_name','Nama klien','client',false],['event_date','Tanggal acara','date',true],['start_time','Jam mulai','time',false],['location','Lokasi acara','text',false],['status','Status proyek','status',true],['contract_value','Nilai kontrak (Rp)','number',false],['notes','Catatan','textarea',false]],clients:[['name','Nama klien','text',true],['organization','Organisasi / instansi','text',false],['phone','Nomor telepon / WhatsApp','tel',false],['email','Email','email',false],['notes','Catatan','textarea',false]],equipment:[['name','Nama peralatan / kru','text',true],['category','Kategori','category',false],['quantity','Jumlah','number',true],['status','Status','equipmentStatus',true],['notes','Catatan','textarea',false]],transactions:[['kind','Jenis transaksi','kind',true],['description','Keterangan','text',true],['category','Kategori biaya','txcategory',false],['amount','Nominal (Rp)','number',true],['transaction_date','Tanggal transaksi','date',true],['project_name','Nama proyek terkait','text',false],['notes','Catatan','textarea',false]]};let title={events:'proyek',clients:'klien',equipment:'peralatan / kru',transactions:'transaksi'}[type];let body=fields[type].map(([key,label,kind,required])=>{let val=data[key]??(key==='status'&&type==='events'?'Terjadwal':key==='status'&&type==='equipment'?'Tersedia':key==='kind'?'Masuk':key==='quantity'?1:key==='event_date'||key==='transaction_date'?new Date().toISOString().slice(0,10):'');let req=required?'required':'';if(kind==='textarea')return `<div class="field full"><label>${label}</label><textarea name="${key}">${esc(val)}</textarea></div>`;if(kind==='client')return `<div class="field"><label>${label}</label><select name="${key}">${optionsForClients(val)}</select></div>`;let opts={status:['Terjadwal','DP Dibayar','Berlangsung','Selesai','Dibatalkan','Lunas'],equipmentStatus:['Tersedia','Dipakai','Perawatan'],kind:['Masuk','Keluar'],category:['Kamera','Laptop / Komputer','Audio','Jaringan / Internet','Kabel & Aksesori','Kru','Lainnya'],txcategory:['DP Klien','Pelunasan','Sewa Peralatan','Transportasi','Honor Kru','Internet','Konsumsi','Perawatan','Lainnya']}[kind];if(opts)return `<div class="field"><label>${label}</label><select name="${key}" ${req}>${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;return `<div class="field"><label>${label}</label><input name="${key}" type="${kind}" value="${esc(val)}" ${req} ${kind==='number'?'min="0" step="any"':''}></div>`}).join('');$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeForm()"><form class="modal" onsubmit="saveForm(event,'${type}','${id||''}')"><div class="modalhead"><h3>${id?'Edit':'Tambah'} ${title}</h3><button type="button" class="btn small" onclick="closeForm()">✕</button></div><div class="formgrid">${body}</div><div class="modalactions"><button type="button" class="btn" onclick="closeForm()">Batal</button><button class="btn primary" type="submit">Simpan ke cloud</button></div></form></div>`}
function closeForm(){$('#modalroot').innerHTML=''}
async function saveForm(ev,type,id){ev.preventDefault();let form=ev.target,obj={};new FormData(form).forEach((v,k)=>obj[k]=v);if(['contract_value','amount','quantity'].some(k=>obj[k]!==undefined))for(let k of ['contract_value','amount','quantity'])if(obj[k]!==undefined)obj[k]=Number(obj[k]||0);if(type==='events'&&!obj.client_name)obj.client_name=null;try{let r=id?await supa.from(type).update(obj).eq('id',id).select().single():await supa.from(type).insert(obj).select().single();if(r.error)throw r.error;closeForm();toast('Data berhasil disimpan ke database cloud.');await loadData()}catch(e){toast('Gagal menyimpan: '+e.message)}}
async function quickUpdate(type,id,key,value){try{let r=await supa.from(type).update({[key]:value}).eq('id',id);if(r.error)throw r.error;toast('Status diperbarui.');await loadData()}catch(e){toast('Gagal memperbarui: '+e.message)}}
async function delRow(type,id){if(!confirm('Hapus data ini secara permanen?'))return;try{let r=await supa.from(type).delete().eq('id',id);if(r.error)throw r.error;toast('Data dihapus.');await loadData()}catch(e){toast('Gagal menghapus: '+e.message)}}
async function logout(){if(supa)await supa.auth.signOut();state.user=null;showAuth()}
function exportCSV(){let rows=[['Tanggal','Jenis','Keterangan','Kategori','Proyek','Nominal'],...state.transactions.map(t=>[t.transaction_date,t.kind,t.description,t.category,t.project_name,t.amount])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='red-project-transaksi.csv';a.click();URL.revokeObjectURL(a.href)}
initClient();if(cfgReady()){supa.auth.onAuthStateChange(()=>{});boot()}else showAuth();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(err => console.warn("PWA service worker:", err))); }
</script></body></html>
